<title>Helmet Comms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Helmet Comms">
<meta name="theme-color" content="#101418">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
/* Layout: one-column visor HUD. Mode tabs, big start button, then preset + tuning. Single dark theme on purpose (worn at night, in a helmet). */
:root {
  --bg: #101418;
  --panel: #182027;
  --line: #2a3640;
  --fg: #e6ebee;
  --dim: #8796a1;
  --accent: #dfe8f0;      /* swapped per preset */
  --accent-ink: #101418;
  --live: #ff5a4a;
  --ok: #4fd18b;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
:root[data-preset="helldiver"] { --accent: #f2c230; --accent-ink: #1a1404; }
[hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--mono);
  font-size: 17px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 38px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0; line-height: 1; }
.mic { color: var(--dim); font-size: 14px; text-align: right; min-width: 0; overflow-wrap: anywhere; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.seg button {
  font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 14px 4px; border-radius: 6px; border: 0; background: transparent; color: var(--dim); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.mode-help { color: var(--dim); font-size: 15px; line-height: 1.5; margin: -12px 0 0; }

.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.presets button {
  font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 18px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer;
}
.presets button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.code-box { display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 18px; border-radius: 10px; border: 1px dashed var(--line); }
.code-box .lbl { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.code-box .code { font-family: var(--mono); font-weight: 500; font-size: 56px; letter-spacing: 0.2em; line-height: 1; padding-left: 0.2em; }
.code-entry { display: flex; flex-direction: column; gap: 8px; }
.code-entry .lbl { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.code-entry input {
  font-family: var(--mono); font-size: 44px; letter-spacing: 0.3em; text-transform: uppercase; text-align: center;
  padding: 14px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); width: 100%;
}

.status { display: flex; align-items: center; gap: 12px; font-size: 18px; padding: 14px 16px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.status .led { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--dim); }
.status[data-s="ok"] .led { background: var(--ok); }
.status[data-s="wait"] .led { background: var(--accent); }
.status[data-s="bad"] .led { background: var(--live); }

.tx {
  position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%;
  border-radius: 10px; border: 2px solid var(--accent); background: var(--panel); color: var(--fg);
  cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--display); overflow: hidden;
}
.tx .big { font-size: clamp(48px, 15vw, 72px); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; }
.tx .small { font-family: var(--mono); font-size: 16px; color: var(--dim); }
.tx .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--line); }
.tx.on { background: var(--accent); color: var(--accent-ink); }
.tx.on .small { color: var(--accent-ink); opacity: 0.75; }
.tx.on .dot { background: var(--accent-ink); }
.tx.open .dot { background: var(--live); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 30%, transparent); }

.meter { height: 18px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); position: relative; overflow: hidden; }
.meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width 60ms linear; }
.meter .thr { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--live); }
.meter-label { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.08em; }

.fx { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fx button {
  font-family: var(--mono); font-size: 18px; padding: 20px 8px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--fg); cursor: pointer;
}
.fx button:active { background: var(--panel); }
.fx .wide { grid-column: 1 / -1; background: var(--panel); font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; }

.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 16px; }
section h2 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin: 0; }
.reset { font-family: var(--mono); font-size: 16px; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.reset:active { background: var(--panel); }
.sliders { display: flex; flex-direction: column; gap: 26px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center; }
.row label { font-size: 19px; }
.row output { font-size: 17px; color: var(--accent); font-variant-numeric: tabular-nums; }

/* big touch-friendly sliders */
.row input[type=range] { grid-column: 1 / -1; width: 100%; height: 44px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; touch-action: pan-y; }
.row input[type=range]::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(to right, var(--accent) var(--pct, 50%), var(--line) var(--pct, 50%)); }
.row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; border-radius: 50%; background: var(--fg); border: 4px solid var(--accent); margin-top: -13px; }
.row input[type=range]::-moz-range-track { height: 14px; border-radius: 7px; background: var(--line); }
.row input[type=range]::-moz-range-progress { height: 14px; border-radius: 7px; background: var(--accent); }
.row input[type=range]::-moz-range-thumb { width: 32px; height: 32px; border-radius: 50%; background: var(--fg); border: 4px solid var(--accent); }

.micpick { display: flex; flex-direction: column; gap: 8px; }
.micpick span { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.micpick select { font-family: var(--mono); font-size: 18px; padding: 16px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); width: 100%; }
.note { color: var(--dim); font-size: 15px; line-height: 1.6; border-top: 1px solid var(--line); padding-top: 16px; }
.err { color: var(--live); font-size: 16px; line-height: 1.5; }

.blackout { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; align-items: flex-end; justify-content: center; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); touch-action: none; user-select: none; -webkit-user-select: none; }
.blackout span { color: #1c1c1c; font-size: 14px; font-family: var(--mono); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .meter .fill { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Helmet Comms</h1>
    <div class="mic" id="micLabel"></div>
  </header>

  <div class="seg" role="group" aria-label="Mode">
    <button id="m-solo" data-m="solo">Solo</button>
    <button id="m-mic" data-m="mic">Mic</button>
    <button id="m-speaker" data-m="speaker">Speaker</button>
  </div>
  <p class="mode-help" id="modeHelp"></p>

  <!-- Speaker: shows its pairing code -->
  <div class="code-box" id="codeBox" data-show="speaker">
    <span class="lbl">Pairing code</span>
    <span class="code" id="myCode">----</span>
  </div>

  <!-- Mic: enter the speaker's code -->
  <label class="code-entry" data-show="mic">
    <span class="lbl">Speaker's code</span>
    <input id="targetCode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="----">
  </label>

  <div class="status" id="status" data-s="idle" data-show="mic speaker"><span class="led"></span><span id="statusText">Not started</span></div>

  <div class="presets" role="group" aria-label="Voice preset" data-show="solo speaker">
    <button id="p-trooper" data-p="trooper" aria-pressed="true">Trooper</button>
    <button id="p-helldiver" data-p="helldiver" aria-pressed="false">Helldiver</button>
  </div>

  <button class="tx" id="tx" aria-pressed="false">
    <span class="dot"></span>
    <span class="big" id="txBig">Start</span>
    <span class="small" id="txSmall">Tap to start</span>
  </button>

  <div>
    <div class="meter" aria-hidden="true"><div class="fill" id="meterFill"></div><div class="thr" id="meterThr"></div></div>
    <div class="meter-label"><span id="meterName">Voice level</span><span data-show="solo speaker">Red line = gate</span></div>
  </div>

  <label class="micpick" id="micPick" hidden>
    <span>Microphone</span>
    <select id="micSel"></select>
  </label>

  <div class="fx">
    <button id="fxOpen" data-show="solo speaker">Test click</button>
    <button id="fxCrackle" data-show="solo speaker">Comms crackle</button>
    <button id="blackoutBtn" class="wide">Blackout screen</button>
  </div>

  <p class="err" id="err" hidden></p>

  <section data-show="solo speaker">
    <div class="sec-head">
      <h2>Tuning</h2>
      <button class="reset" id="resetBtn">Reset to default</button>
    </div>
    <div class="sliders" id="sliders"></div>
  </section>

  <p class="note" id="note"></p>
</div>

<div class="blackout" id="blackout" hidden><span>Hold to exit</span></div>
<audio id="remoteAudio" playsinline muted hidden></audio>

<script>
// ---------- Settings ----------
const PRESETS = {
  trooper:   { input: 1.4, lowcut: 450, highcut: 2800, presence: 7, drive: 0.55, echo: 0.35, hiss: 0.03, sfx: 0.35, gate: -45, output: 0.9 },
  helldiver: { input: 1.4, lowcut: 400, highcut: 2900, presence: 5, drive: 0.3,  echo: 0.0,  hiss: 0.04, sfx: 0.35, gate: -45, output: 0.9 }
};
const SLIDERS = [
  { k: "input",    label: "Mic boost",      min: 0.5, max: 4,    step: 0.1, fmt: v => v.toFixed(1) + "×" },
  { k: "lowcut",   label: "Low cut",        min: 100, max: 900,  step: 10,  fmt: v => v + " Hz" },
  { k: "highcut",  label: "High cut",       min: 1800,max: 6000, step: 50,  fmt: v => v + " Hz" },
  { k: "presence", label: "Presence",       min: 0,   max: 14,   step: 1,   fmt: v => "+" + v + " dB" },
  { k: "drive",    label: "Distortion",     min: 0,   max: 1,    step: 0.01,fmt: v => Math.round(v * 100) + "%" },
  { k: "echo",     label: "Helmet echo",    min: 0,   max: 0.8,  step: 0.01,fmt: v => Math.round(v * 100) + "%" },
  { k: "hiss",     label: "Radio hiss",     min: 0,   max: 0.4,  step: 0.01,fmt: v => Math.round(v * 100) + "%" },
  { k: "sfx",      label: "Click / static", min: 0,   max: 1,    step: 0.01,fmt: v => Math.round(v * 100) + "%" },
  { k: "gate",     label: "Gate",           min: -70, max: -20,  step: 1,   fmt: v => v + " dB" },
  { k: "output",   label: "Output",         min: 0,   max: 2,    step: 0.01,fmt: v => Math.round(v * 100) + "%" }
];
const MODE_HELP = {
  solo: "Everything on this one phone, using its own mic.",
  mic: "Use on the phone your AirPods are connected to. It sends your voice to the Speaker phone.",
  speaker: "Use on the phone in your chest pocket. It plays your voice with the effect, through its speaker or a connected one."
};
const MODE_NOTE = {
  solo: "Keep the speaker pointed away from you to avoid feedback. If it squeals, lower Output or raise the Gate. Settings save on this phone.",
  mic: "Both phones must be on the same Wi-Fi or hotspot. Keep this screen on: use Blackout, and press and hold anywhere to exit. If the connection drops, it reconnects on its own.",
  speaker: "Tap Start here first, then start the Mic phone. Keep this screen on: use Blackout, and press and hold anywhere to exit. Settings save on this phone."
};

function load() { try { return JSON.parse(localStorage.getItem("helmetComms")) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem("helmetComms", JSON.stringify(state)); } catch (e) {} }
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const newCode = () => Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");

let state = Object.assign(
  { preset: "trooper", mode: "solo", micId: null, myCode: null, target: "", settings: { trooper: { ...PRESETS.trooper }, helldiver: { ...PRESETS.helldiver } } },
  load() || {}
);
if (!state.myCode) { state.myCode = newCode(); save(); }
const S = () => state.settings[state.preset];
const peerId = code => "helmetcomms-" + code.toUpperCase();
const $ = id => document.getElementById(id);

// ---------- UI ----------
SLIDERS.forEach(d => {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<label for="s-${d.k}">${d.label}</label><output id="o-${d.k}"></output>
    <input type="range" id="s-${d.k}" min="${d.min}" max="${d.max}" step="${d.step}">`;
  $("sliders").appendChild(row);
  row.querySelector("input").addEventListener("input", e => {
    S()[d.k] = parseFloat(e.target.value); syncLabels(); applyParams(); save();
  });
});
function syncSliders() { SLIDERS.forEach(d => { $("s-" + d.k).value = S()[d.k]; }); syncLabels(); }
function syncLabels() {
  SLIDERS.forEach(d => {
    $("o-" + d.k).textContent = d.fmt(S()[d.k]);
    $("s-" + d.k).style.setProperty("--pct", ((S()[d.k] - d.min) / (d.max - d.min) * 100) + "%");
  });
  $("meterThr").style.left = dbToPct(S().gate) + "%";
  $("meterThr").hidden = state.mode === "mic";
}
function setPreset(p) {
  state.preset = p; save();
  document.documentElement.dataset.preset = p;
  document.querySelectorAll(".presets button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === p));
  syncSliders(); applyParams();
}
document.querySelectorAll(".presets button").forEach(b => b.addEventListener("click", () => setPreset(b.dataset.p)));

function setMode(m) {
  if (running) stop();
  state.mode = m; save();
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === m));
  document.querySelectorAll("[data-show]").forEach(el => { el.hidden = !el.dataset.show.split(" ").includes(m); });
  $("modeHelp").textContent = MODE_HELP[m];
  $("note").textContent = MODE_NOTE[m];
  $("myCode").textContent = state.myCode;
  $("meterName").textContent = m === "speaker" ? "Incoming voice" : "Voice level";
  $("micPick").hidden = true; $("micLabel").textContent = "";
  setStatus("idle", "Not started");
  syncLabels(); setTx();
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.m)));
$("targetCode").value = state.target || "";
$("targetCode").addEventListener("input", e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  state.target = e.target.value; save();
});
function setStatus(s, text) { $("status").dataset.s = s; $("statusText").textContent = text; }
const dbToPct = db => Math.max(0, Math.min(100, (db + 70) / 60 * 100));
function showErr(t) { $("err").textContent = t; $("err").hidden = !t; }

// ---------- Audio engine ----------
let ctx, stream, src, nodes = {}, noiseBuf, running = false, gateOpen = false, lastLoud = 0, raf, wakeLock;
let peer, call, retryTimer, remoteStream;

function curve(amount) {
  const k = amount * 60 + 1, n = 2048, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }
  return c;
}
function makeNoise() {
  const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
async function newCtx() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
  await ctx.resume();
  noiseBuf = makeNoise();
}
async function getMic() {
  const audio = { echoCancellation: false, noiseSuppression: true, autoGainControl: false };
  if (state.micId) audio.deviceId = { exact: state.micId };
  try { stream = await navigator.mediaDevices.getUserMedia({ audio }); }
  catch (e) { delete audio.deviceId; state.micId = null; stream = await navigator.mediaDevices.getUserMedia({ audio }); }
  const track = stream.getAudioTracks()[0];
  $("micLabel").textContent = "Mic: " + (track.label || "default");
  listMics(track.getSettings().deviceId);
}

// Effect chain: nodes.input -> filters -> distortion -> compressor -> gate -> output
function buildChain() {
  const n = nodes = {};
  n.input = ctx.createGain();
  n.hp = ctx.createBiquadFilter(); n.hp.type = "highpass"; n.hp.Q.value = 0.9;
  n.hp2 = ctx.createBiquadFilter(); n.hp2.type = "highpass"; n.hp2.Q.value = 0.7;
  n.lp = ctx.createBiquadFilter(); n.lp.type = "lowpass"; n.lp.Q.value = 0.9;
  n.lp2 = ctx.createBiquadFilter(); n.lp2.type = "lowpass"; n.lp2.Q.value = 0.7;
  n.pres = ctx.createBiquadFilter(); n.pres.type = "peaking"; n.pres.Q.value = 1.2;
  n.scoop = ctx.createBiquadFilter(); n.scoop.type = "peaking"; n.scoop.frequency.value = 1000; n.scoop.Q.value = 2;
  n.shaper = ctx.createWaveShaper(); n.shaper.oversample = "2x";
  n.comp = ctx.createDynamicsCompressor(); n.comp.attack.value = 0.003; n.comp.release.value = 0.12; n.comp.knee.value = 6;
  n.delay = ctx.createDelay(0.1); n.fb = ctx.createGain(); n.echoMix = ctx.createGain();
  n.analyser = ctx.createAnalyser(); n.analyser.fftSize = 1024;
  n.gate = ctx.createGain(); n.gate.gain.value = 0;
  n.out = ctx.createGain();
  n.hissSrc = ctx.createBufferSource(); n.hissSrc.buffer = noiseBuf; n.hissSrc.loop = true;
  n.hissBp = ctx.createBiquadFilter(); n.hissBp.type = "bandpass"; n.hissBp.frequency.value = 2500; n.hissBp.Q.value = 0.6;
  n.hiss = ctx.createGain();
  n.hissSrc.connect(n.hissBp).connect(n.hiss).connect(n.gate); n.hissSrc.start();
  n.input.connect(n.hp).connect(n.hp2).connect(n.lp).connect(n.lp2).connect(n.pres).connect(n.scoop).connect(n.shaper).connect(n.comp);
  n.input.connect(n.analyser);
  n.comp.connect(n.gate);
  n.comp.connect(n.delay); n.delay.connect(n.fb).connect(n.delay); n.delay.connect(n.echoMix).connect(n.gate);
  n.gate.connect(n.out).connect(ctx.destination);
  applyParams();
}
function applyParams() {
  if (!ctx || !nodes.out) return;
  const s = S(), t = ctx.currentTime, n = nodes, hd = state.preset === "helldiver";
  n.input.gain.setTargetAtTime(s.input, t, 0.02);
  n.hp.frequency.setTargetAtTime(s.lowcut, t, 0.02); n.hp2.frequency.setTargetAtTime(s.lowcut, t, 0.02);
  n.lp.frequency.setTargetAtTime(s.highcut, t, 0.02); n.lp2.frequency.setTargetAtTime(s.highcut, t, 0.02);
  n.pres.frequency.setTargetAtTime(hd ? 1800 : 1700, t, 0.02);
  n.pres.gain.setTargetAtTime(s.presence, t, 0.02);
  n.scoop.gain.setTargetAtTime(hd ? -4 : 0, t, 0.02);
  n.comp.ratio.setTargetAtTime(hd ? 5 : 10, t, 0.02);
  n.comp.threshold.setTargetAtTime(hd ? -24 : -28, t, 0.02);
  n.shaper.curve = curve(s.drive);
  n.fb.gain.setTargetAtTime(s.echo * 0.7, t, 0.02);
  n.echoMix.gain.setTargetAtTime(s.echo, t, 0.02);
  n.delay.delayTime.setTargetAtTime(hd ? 0.004 : 0.009, t, 0.02);
  n.hiss.gain.setTargetAtTime(s.hiss * 0.25, t, 0.02);
  n.out.gain.setTargetAtTime(s.output, t, 0.02);
}

const buf = new Float32Array(1024);
function levelDb() {
  nodes.analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  return 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-9);
}
function loop() {
  if (!running) return;
  const db = levelDb();
  $("meterFill").style.width = dbToPct(db) + "%";
  if (state.mode !== "mic") {
    const now = performance.now(), t = ctx.currentTime;
    if (db > S().gate) {
      lastLoud = now;
      if (!gateOpen) { gateOpen = true; sfxOpen(); nodes.gate.gain.setTargetAtTime(1, t, 0.005); setTx(); }
    } else if (gateOpen && now - lastLoud > 320) {
      gateOpen = false; nodes.gate.gain.setTargetAtTime(0, t, 0.03); sfxClose(); setTx();
    }
  }
  raf = requestAnimationFrame(loop);
}

// ---------- Modes ----------
async function start() {
  showErr("");
  if (state.mode === "mic" && state.target.length !== 4) { showErr("Type the 4-character code shown on the Speaker phone first."); return; }
  try {
    await newCtx();
    if (state.mode !== "speaker") await getMic();
  } catch (e) {
    showErr("Couldn't open the microphone. Allow mic access for this site in your browser settings, then tap Start again.");
    if (ctx) ctx.close(); ctx = null; return;
  }
  running = true; gateOpen = false;
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}

  if (state.mode === "solo") {
    buildChain();
    src = ctx.createMediaStreamSource(stream); src.connect(nodes.input);
    sfxOpen();
  } else if (state.mode === "speaker") {
    buildChain();
    startSpeakerPeer();
  } else {
    // Mic: meter only, nothing plays on this phone
    nodes = { analyser: ctx.createAnalyser() }; nodes.analyser.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(nodes.analyser);
    startMicPeer();
  }
  setTx(); loop();
}

function stop() {
  running = false; cancelAnimationFrame(raf); clearTimeout(retryTimer);
  try { call?.close(); } catch (e) {} call = null;
  try { peer?.destroy(); } catch (e) {} peer = null;
  try { wakeLock?.release(); } catch (e) {}
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  const ra = $("remoteAudio"); ra.srcObject = null; remoteStream = null;
  ctx?.close(); ctx = null; nodes = {}; src = null;
  $("meterFill").style.width = "0";
  if (state.mode !== "solo") setStatus("idle", "Stopped");
  setTx();
}

// Speaker: register under our code and wait for the Mic phone to call
function startSpeakerPeer() {
  if (typeof Peer === "undefined") { setStatus("bad", "Connection library didn't load. Check internet and reload."); return; }
  setStatus("wait", "Connecting…");
  peer = new Peer(peerId(state.myCode));
  peer.on("open", () => setStatus("wait", "Ready. Start the Mic phone with code " + state.myCode));
  peer.on("call", c => {
    try { call?.close(); } catch (e) {}
    call = c;
    c.answer();
    c.on("stream", s => attachRemote(s));
    c.on("close", () => { if (call === c) { setStatus("wait", "Mic disconnected. Waiting for it to reconnect…"); call = null; } });
    c.on("error", () => setStatus("wait", "Mic disconnected. Waiting for it to reconnect…"));
  });
  peer.on("disconnected", () => { if (running) setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on("error", e => {
    if (!running) return;
    if (e.type === "unavailable-id") {
      setStatus("wait", "Code still in use from last session. Retrying…");
      try { peer.destroy(); } catch (x) {}
      retryTimer = setTimeout(() => { if (running) startSpeakerPeer(); }, 4000);
    } else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "socket-closed") {
      setStatus("bad", "No internet for pairing. Retrying…");
      try { peer.destroy(); } catch (x) {}
      retryTimer = setTimeout(() => { if (running) startSpeakerPeer(); }, 3000);
    }
  });
}
function attachRemote(s) {
  remoteStream = s;
  // Chrome only feeds a remote stream into Web Audio if it's also attached to a media element.
  const ra = $("remoteAudio"); ra.srcObject = s; ra.muted = true; ra.play().catch(() => {});
  try { src?.disconnect(); } catch (e) {}
  src = ctx.createMediaStreamSource(s); src.connect(nodes.input);
  try { call.peerConnection.getReceivers().forEach(r => { if ("jitterBufferTarget" in r) r.jitterBufferTarget = 0; }); } catch (e) {}
  setStatus("ok", "Mic connected");
  sfxOpen();
}

// Mic: call the Speaker phone and keep retrying until connected
function startMicPeer() {
  if (typeof Peer === "undefined") { setStatus("bad", "Connection library didn't load. Check internet and reload."); return; }
  setStatus("wait", "Connecting…");
  peer = new Peer();
  peer.on("open", () => dial());
  peer.on("disconnected", () => { if (running) setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on("error", e => {
    if (!running) return;
    if (e.type === "peer-unavailable") { setStatus("wait", "Speaker " + state.target + " not found. Is it started? Retrying…"); scheduleDial(2500); }
    else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "socket-closed") {
      setStatus("bad", "No internet for pairing. Retrying…");
      try { peer.destroy(); } catch (x) {}
      retryTimer = setTimeout(() => { if (running) startMicPeer(); }, 3000);
    }
  });
}
function scheduleDial(ms) { clearTimeout(retryTimer); retryTimer = setTimeout(() => { if (running) dial(); }, ms); }
function dial() {
  if (!running || !peer || peer.destroyed) return;
  if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} scheduleDial(2000); return; }
  setStatus("wait", "Calling speaker " + state.target + "…");
  const c = peer.call(peerId(state.target), stream);
  if (!c) { scheduleDial(2500); return; }
  call = c;
  const pc = c.peerConnection;
  if (pc) pc.addEventListener("connectionstatechange", () => {
    if (call !== c) return;
    if (pc.connectionState === "connected") setStatus("ok", "Connected to speaker " + state.target);
    if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
      setStatus("wait", "Connection lost. Reconnecting…");
      try { c.close(); } catch (e) {}
      scheduleDial(1500);
    }
  });
  c.on("close", () => { if (call === c && running) { setStatus("wait", "Connection lost. Reconnecting…"); scheduleDial(1500); } });
  // If nothing connects within 10s, try again
  setTimeout(() => { if (call === c && running && pc && pc.connectionState !== "connected") { try { c.close(); } catch (e) {} scheduleDial(500); } }, 10000);
}

async function listMics(currentId) {
  try {
    const mics = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
    const sel = $("micSel"); sel.innerHTML = "";
    mics.forEach((m, i) => {
      const o = document.createElement("option");
      o.value = m.deviceId; o.textContent = m.label || ("Microphone " + (i + 1));
      if (m.deviceId === currentId) o.selected = true;
      sel.appendChild(o);
    });
    $("micPick").hidden = mics.length < 2;
  } catch (e) {}
}
$("micSel").addEventListener("change", async e => {
  state.micId = e.target.value; save();
  if (running) { stop(); await start(); }
});

// ---------- Sound effects (walkie-talkie clicks, no tones) ----------
function noiseBurst(dur, freq, q, vol, when = 0) {
  if (!ctx || !nodes.out) return;
  const t = ctx.currentTime + when;
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(nodes.out);
  s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
function sfxOpen() {
  const v = S().sfx; if (!v) return;
  noiseBurst(0.012, 2800, 1.2, v * 0.8);
  noiseBurst(0.05, 2200, 0.6, v * 0.25, 0.008);
}
function sfxClose() {
  const v = S().sfx; if (!v) return;
  const len = state.preset === "trooper" ? 0.16 : 0.1;
  noiseBurst(len, 2400, 0.5, v * 0.35);
  noiseBurst(0.012, 3000, 1.2, v * 0.7, len - 0.01);
}
function crackle() {
  const v = Math.max(S().sfx, 0.3);
  for (let i = 0; i < 9; i++) noiseBurst(0.03 + Math.random() * 0.08, 1500 + Math.random() * 2500, 0.8, v * (0.3 + Math.random() * 0.6), i * 0.07 + Math.random() * 0.04);
}

// ---------- Controls ----------
function setTx() {
  const b = $("tx"), m = state.mode;
  b.classList.toggle("on", running); b.classList.toggle("open", running && gateOpen && m !== "mic");
  b.setAttribute("aria-pressed", running);
  const idleBig = m === "mic" ? "Start mic" : m === "speaker" ? "Start speaker" : "Start";
  let liveBig = gateOpen ? "Transmitting" : "Listening";
  if (m === "mic") liveBig = "Sending";
  $("txBig").textContent = running ? liveBig : idleBig;
  $("txSmall").textContent = running ? "Tap to stop" : "Tap to start";
}
$("tx").addEventListener("click", () => running ? stop() : start());
$("fxOpen").addEventListener("click", () => { if (running) { sfxOpen(); setTimeout(sfxClose, 500); } });
$("fxCrackle").addEventListener("click", () => { if (running) crackle(); });
$("resetBtn").addEventListener("click", () => {
  state.settings[state.preset] = { ...PRESETS[state.preset] };
  save(); syncSliders(); applyParams();
  const b = $("resetBtn"); b.textContent = "Reset ✓";
  setTimeout(() => { b.textContent = "Reset to default"; }, 1200);
});
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && running) {
    ctx?.resume();
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  }
});

// Blackout: black screen, comms keep running, press-and-hold to exit
const blackout = $("blackout");
let holdTimer;
$("blackoutBtn").addEventListener("click", async () => {
  blackout.hidden = false;
  try { if (!wakeLock || wakeLock.released) wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
});
blackout.addEventListener("pointerdown", () => { holdTimer = setTimeout(() => { blackout.hidden = true; }, 900); });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => blackout.addEventListener(ev, () => clearTimeout(holdTimer)));
blackout.addEventListener("contextmenu", e => e.preventDefault());

setPreset(state.preset);
setMode(state.mode);
</script>
